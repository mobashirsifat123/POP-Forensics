<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Contradiction-first POP decision logic</title><desc id="desc">FAIL if contradicted; otherwise UNRESOLVED if evidence is missing; otherwise PASS. All assertions are evaluated.</desc><rect x="0" y="0" width="1120" height="382" rx="0" fill="#FFFFFF" stroke="none"/><text x="30" y="40" font-size="14" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >DECISION PRIORITY</text><text x="30" y="80" font-size="28" fill="#112C46" font-weight="600" font-family="Georgia, serif" >A contradiction always takes priority.</text><path d="M30 111L1090 111" fill="none" stroke="#DCE3E8" stroke-width="1"/><text x="30" y="144" font-size="19" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >1</text><text x="77" y="144" font-size="20" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Any assertion contradicted?</text><rect x="684" y="120" width="185" height="39" rx="3" fill="#B13B3B" stroke="none"/><text x="701" y="145" font-size="16" fill="#FFFFFF" font-weight="600" font-family="Arial, Helvetica, sans-serif" >FAIL</text><text x="892" y="141" font-size="12" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" ></text><text x="77" y="170" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Even when other evidence is missing</text><path d="M30 197L1090 197" fill="none" stroke="#DCE3E8" stroke-width="1"/><text x="30" y="230" font-size="19" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >2</text><text x="77" y="230" font-size="20" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Otherwise, any evidence missing or unusable?</text><rect x="684" y="206" width="185" height="39" rx="3" fill="#886010" stroke="none"/><text x="701" y="231" font-size="16" fill="#FFFFFF" font-weight="600" font-family="Arial, Helvetica, sans-serif" >UNRESOLVED</text><text x="892" y="227" font-size="12" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" ></text><text x="77" y="256" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >No contradiction has been established</text><path d="M30 283L1090 283" fill="none" stroke="#DCE3E8" stroke-width="1"/><text x="30" y="316" font-size="19" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >3</text><text x="77" y="316" font-size="20" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Otherwise, every required assertion satisfied.</text><rect x="684" y="292" width="185" height="39" rx="3" fill="#087F80" stroke="none"/><text x="701" y="317" font-size="16" fill="#FFFFFF" font-weight="600" font-family="Arial, Helvetica, sans-serif" >PASS</text><text x="892" y="313" font-size="12" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" ></text><text x="77" y="342" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Acceptance is scoped to the registration</text></svg>
