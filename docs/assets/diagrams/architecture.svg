<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">POP software architecture</title><desc id="desc">CLI validates a registration and supplies local evidence to verification and semantic checks; a JSON receipt records results. Metrics are separate helpers.</desc><rect x="0" y="0" width="1120" height="365" rx="0" fill="#FFFFFF" stroke="none"/><text x="28" y="39" font-size="14" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >SMALL MODULES. EXPLICIT RESPONSIBILITIES.</text><rect x="28" y="90" width="180" height="100" rx="3" fill="#F7F8F5" stroke="#DCE3E8"/><text x="46" y="124" font-size="18" fill="#112C46" font-weight="600" font-family="Menlo, Consolas, monospace" >cli.py</text><text x="46" y="156" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Commands &amp; exit codes</text><rect x="265" y="90" width="240" height="100" rx="3" fill="#F7F8F5" stroke="#DCE3E8"/><text x="283" y="124" font-size="18" fill="#112C46" font-weight="600" font-family="Menlo, Consolas, monospace" >registration.py</text><text x="283" y="156" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Validate the contract</text><rect x="265" y="230" width="240" height="100" rx="3" fill="#F7F8F5" stroke="#DCE3E8"/><text x="283" y="264" font-size="18" fill="#112C46" font-weight="600" font-family="Menlo, Consolas, monospace" >evidence.py</text><text x="283" y="296" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Local JSON, paths, SHA-256</text><rect x="575" y="90" width="240" height="100" rx="3" fill="#F7F8F5" stroke="#DCE3E8"/><text x="593" y="124" font-size="18" fill="#112C46" font-weight="600" font-family="Menlo, Consolas, monospace" >verification.py</text><text x="593" y="156" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Evaluate all assertions</text><rect x="575" y="230" width="240" height="100" rx="3" fill="#F7F8F5" stroke="#DCE3E8"/><text x="593" y="264" font-size="18" fill="#112C46" font-weight="600" font-family="Menlo, Consolas, monospace" >checks.py</text><text x="593" y="296" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Semantic gate checks</text><rect x="885" y="90" width="205" height="100" rx="3" fill="#F7F8F5" stroke="#DCE3E8"/><text x="903" y="124" font-size="18" fill="#112C46" font-weight="600" font-family="Menlo, Consolas, monospace" >JSON receipt</text><text x="903" y="156" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Outcomes &amp; reasons</text><path d="M208 140H265" fill="none" stroke="#245CBE" stroke-width="2"/><path d="M505 140H575" fill="none" stroke="#245CBE" stroke-width="2"/><path d="M505 280H540V162H575" fill="none" stroke="#087F80" stroke-width="2"/><path d="M695 190V230" fill="none" stroke="#087F80" stroke-width="2"/><path d="M815 140H885" fill="none" stroke="#245CBE" stroke-width="2"/><text x="28" y="344" font-size="15" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >metrics.py supplies AUC helpers separately; it does not automatically score evidence.</text></svg>
