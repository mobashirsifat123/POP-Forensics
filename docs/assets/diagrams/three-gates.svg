<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc"><title id="title">Three POP evidence dimensions</title><desc id="desc">Population and estimand, objective and realized optimization, prediction-input provenance; each has explicit evidence checks.</desc><rect x="0" y="0" width="1120" height="350" rx="0" fill="#FFFFFF" stroke="none"/><path d="M28 25L348 25" fill="none" stroke="#245CBE" stroke-width="4"/><text x="28" y="93" font-size="54" fill="#245CBE" font-weight="600" font-family="Georgia, serif" >P1</text><text x="28" y="142" font-size="23" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Population &amp; estimand</text><text x="28" y="180" font-size="15" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Which observations define the claim?</text><text x="28" y="226" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Row, label and split membership</text><text x="28" y="255" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Content exclusions</text><text x="28" y="284" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Registered evaluation weights</text><path d="M400 25L720 25" fill="none" stroke="#087F80" stroke-width="4"/><text x="400" y="93" font-size="54" fill="#087F80" font-weight="600" font-family="Georgia, serif" >O</text><text x="400" y="142" font-size="23" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Objective &amp; optimization</text><text x="400" y="180" font-size="15" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Was the intended training realized?</text><text x="400" y="226" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Probability-target validity</text><text x="400" y="255" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Successful / skipped update counts</text><text x="400" y="284" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Initialization and parameter changes</text><path d="M772 25L1092 25" fill="none" stroke="#536582" stroke-width="4"/><text x="772" y="93" font-size="54" fill="#536582" font-weight="600" font-family="Georgia, serif" >P2</text><text x="772" y="142" font-size="23" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Prediction provenance</text><text x="772" y="180" font-size="15" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Were the intended inputs used?</text><text x="772" y="226" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Cache completion record</text><text x="772" y="255" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Artifact digests</text><text x="772" y="284" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >External prediction reconstruction</text></svg>
