<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc"><title id="title">POP verification overview</title><desc id="desc">Register the comparison, collect evidence, verify P1 O P2, reduce decisions and retain a hashed receipt.</desc><rect x="0" y="0" width="1120" height="270" rx="0" fill="#FFFFFF" stroke="none"/><text x="28" y="38" font-size="14" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >ONE REGISTERED COMPARISON. ONE INSPECTABLE EVIDENCE CHAIN.</text><path d="M28 68L208 68" fill="none" stroke="#DCE3E8" stroke-width="3"/><text x="28" y="101" font-size="14" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >01</text><text x="28" y="139" font-size="27" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Register</text><text x="28" y="174" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Arms, rows, weights</text><text x="28" y="198" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >and tolerances</text><text x="220" y="139" font-size="22" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >→</text><path d="M248 68L428 68" fill="none" stroke="#DCE3E8" stroke-width="3"/><text x="248" y="101" font-size="14" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >02</text><text x="248" y="139" font-size="27" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Collect</text><text x="248" y="174" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Producer records</text><text x="248" y="198" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >and input artifacts</text><text x="440" y="139" font-size="22" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >→</text><path d="M468 68L678 68" fill="none" stroke="#087F80" stroke-width="3"/><text x="468" y="101" font-size="14" fill="#087F80" font-weight="600" font-family="Arial, Helvetica, sans-serif" >03</text><text x="468" y="139" font-size="27" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Verify</text><text x="468" y="174" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >P1  /  O  /  P2</text><text x="468" y="198" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Evaluate every assertion</text><text x="690" y="139" font-size="22" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >→</text><path d="M718 68L878 68" fill="none" stroke="#DCE3E8" stroke-width="3"/><text x="718" y="101" font-size="14" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >04</text><text x="718" y="139" font-size="27" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Decide</text><text x="718" y="174" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Contradiction-first</text><text x="718" y="198" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >reduction</text><text x="890" y="139" font-size="22" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >→</text><path d="M918 68L1092 68" fill="none" stroke="#DCE3E8" stroke-width="3"/><text x="918" y="101" font-size="14" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >05</text><text x="918" y="139" font-size="27" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Retain</text><text x="918" y="174" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Outcome, hashes</text><text x="918" y="198" font-size="16" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >and assertion reasons</text></svg>
