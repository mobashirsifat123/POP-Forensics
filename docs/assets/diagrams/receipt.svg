<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">An actual POP synthetic evidence receipt</title><desc id="desc">Generated from the PASS demonstration receipt; hashes are abbreviated for display. Includes scope, implementation, 17 assertions and per-gate decisions.</desc><rect x="0" y="0" width="1120" height="420" rx="0" fill="#FFFFFF" stroke="none"/><rect x="28" y="24" width="680" height="366" rx="4" fill="#F7F8F5" stroke="#DCE3E8"/><text x="52" y="62" font-size="13" fill="#536582" font-weight="600" font-family="Arial, Helvetica, sans-serif" >EVIDENCE RECEIPT</text><text x="52" y="101" font-size="23" fill="#112C46" font-weight="600" font-family="Georgia, serif" >synthetic feature-count comparison</text><path d="M52 120L684 120" fill="none" stroke="#DCE3E8" stroke-width="2"/><text x="52" y="152" font-size="15" fill="#536582" font-weight="400" font-family="Menlo, monospace" >implementation</text><text x="242" y="152" font-size="15" fill="#112C46" font-weight="400" font-family="Menlo, monospace" >popverify-reference-0.1.1</text><text x="52" y="187" font-size="15" fill="#536582" font-weight="400" font-family="Menlo, monospace" >registration SHA-256</text><text x="242" y="187" font-size="15" fill="#112C46" font-weight="400" font-family="Menlo, monospace" >425fa4d943f62fa9409a511084…</text><text x="52" y="218" font-size="15" fill="#536582" font-weight="400" font-family="Menlo, monospace" >evidence SHA-256</text><text x="242" y="218" font-size="15" fill="#112C46" font-weight="400" font-family="Menlo, monospace" >d5ff96bd2feb83bcebe4d2e820…</text><text x="52" y="269" font-size="18" fill="#087F80" font-weight="600" font-family="Menlo, monospace" >P1  PASS</text><text x="252" y="269" font-size="18" fill="#087F80" font-weight="600" font-family="Menlo, monospace" >O  PASS</text><text x="452" y="269" font-size="18" fill="#087F80" font-weight="600" font-family="Menlo, monospace" >P2  PASS</text><path d="M52 291L684 291" fill="none" stroke="#DCE3E8" stroke-width="2"/><text x="52" y="330" font-size="17" fill="#112C46" font-weight="400" font-family="Arial, Helvetica, sans-serif" >17 assertions evaluated</text><text x="52" y="360" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >All required registered assertions satisfied.</text><text x="755" y="74" font-size="48" fill="#087F80" font-weight="600" font-family="Georgia, serif" >PASS</text><text x="755" y="119" font-size="19" fill="#112C46" font-weight="600" font-family="Arial, Helvetica, sans-serif" >A real synthetic CLI receipt.</text><text x="755" y="165" font-size="17" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Registration metadata</text><text x="755" y="203" font-size="17" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Input and artifact hashes</text><text x="755" y="241" font-size="17" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Per-assertion outcomes</text><text x="755" y="279" font-size="17" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Reasons for every decision</text><text x="755" y="337" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Hashes shown abbreviated.</text><text x="755" y="361" font-size="14" fill="#536582" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Full JSON is available in the demo.</text></svg>
