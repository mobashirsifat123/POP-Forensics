name: CPU tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_release.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python examples/synthetic/generate.py output/ci
      - run: popverify verify output/ci/registration.json output/ci/evidence.json --json
      - run: popverify verify examples/synthetic/package/registration.json examples/synthetic/package/evidence.json --json
