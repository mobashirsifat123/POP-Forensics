name: CPU tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_release.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify extracted source distribution
        run: |
          mkdir -p output/source
          tar -xzf dist/*.tar.gz -C output/source
          cd output/source/*
          python -m unittest discover -s tests -v
          popverify verify examples/synthetic/package/registration.json examples/synthetic/package/evidence.json --json
      - run: python examples/synthetic/generate.py output/ci
      - run: popverify verify output/ci/registration.json output/ci/evidence.json --json
      - run: popverify verify examples/synthetic/package/registration.json examples/synthetic/package/evidence.json --json

  producer-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[images]'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python examples/evidence_pipeline/run.py output/image-pipeline
      - run: popverify verify output/image-pipeline/registration.json output/image-pipeline/evidence.json --json
