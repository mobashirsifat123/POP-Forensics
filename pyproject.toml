[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pop-forensics"
version = "0.1.1"
description = "Comparison-scoped Population, Objective and Provenance verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "POP-Forensics contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.8"]
images = ["Pillow>=10.4"]
historical = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "pyarrow>=14"]

[project.urls]
Repository = "https://github.com/mobashirsifat123/POP-Forensics"

[project.scripts]
popverify = "popverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
